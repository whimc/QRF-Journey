plugins {
    id 'java'
    id 'journey.java-conventions'
    id 'journey-paper-plugin-conventions' apply false
    id 'com.gradleup.shadow' version '8.3.0'
}

configure(journeyPaperPlugin) {
    pluginName = 'Journey-Bukkit'
}

apply plugin: 'journey-paper-plugin-conventions'

repositories {
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    implementation project(':api')
    implementation project(':paper-api')
    implementation project(':common')
    implementation 'org.bstats:bstats-bukkit:3.0.2'
    implementation 'dev.triumphteam:triumph-gui:3.1.11'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'org.incendo:cloud-paper:2.0.0-beta.10'
}

build {
    jar.enabled = false
    dependsOn 'shadowJar'
}

def journeyPaperPluginExtension = extensions.getByType(JourneyPaperPluginExtension)
shadowJar {
    archiveFileName = journeyPaperPluginExtension.pluginName.get() + "-${project.version}.jar"

    dependencies {
        include(project(':api'))
        include(project(':common'))
        include(project(':paper-api'))

        include(dependency('org.bstats:.*'))
        include(dependency('dev.triumphteam:.*'))
    }

    relocate 'org.bstats', 'net.whimxiqal.journey.libs.bstats'
    relocate 'dev.triumpteam.gui', 'net.whimxiqal.journey.libs.gui'
}
