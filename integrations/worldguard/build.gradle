plugins {
    id 'journey.java-conventions'
    id 'journey-paper-plugin-conventions' apply false
}

version = '1.4.0'

configure(journeyPaperPlugin) {
    pluginName = 'JourneyWorldGuard'
}

apply plugin: 'journey-paper-plugin-conventions'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
}

dependencies {
    implementation project(':api')
    implementation project(':paper-api')
    implementation 'com.sk89q.worldguard:worldguard-core:7.0.9'
    implementation('com.sk89q.worldguard:worldguard-bukkit:7.0.9') {
        exclude group: "org.spigotmc", module: "spigot-api"
    }
}
